name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      # Workspaces build in dependency order: shared, then db, then the apps
      # that consume them. Typecheck catches contract drift between the API and
      # the browser, which share their types through @tda/shared.
      - name: Build shared packages
        run: npm run build --workspace @tda/shared && npm run build --workspace @tda/db

      - name: Typecheck
        run: npm run typecheck

      - name: Build API
        run: npm run build --workspace api

      - name: Build web
        run: npm run build --workspace web
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
